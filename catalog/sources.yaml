# Open Bible Library: master source catalog
#
# Every source the library collects, mirrors, keeps apart, or refuses is listed here.
# Licenses were checked on 2026-11-25 against each source's own LICENSE file,
# README or copyright page (the `evidence` URL). Re-check on every update.
#
# tier:
#   open           -> redistributable for any purpose, including commercial use
#   open-nd        -> redistributable unchanged, including commercially; do NOT edit or merge (CC BY-ND)
#   noncommercial  -> redistributable for non-commercial use only; kept out of library/
#   excluded       -> NOT redistributable or license unclear; never added (see EXCLUDED.md)
# method:
#   vendored  -> copied into library/ in this repo
#   mirror    -> too large for git; tools/fetch.py clones it and the archive workflow publishes it as a release asset
#   fetch     -> downloaded from a non-GitHub host by tools/fetch.py, filtered by license
#   none      -> not collected

verified_on: 2026-11-25

sources:

  # ---------------- Original-language texts ----------------
  - id: oshb
    name: Open Scriptures Hebrew Bible (Westminster Leningrad Codex + morphology)
    upstream: https://github.com/openscriptures/morphhb
    commit: db6c5c9b46b8f39346f10915ddb1a70dcd429901
    license: CC-BY-4.0 (morphology); WLC text public domain
    evidence: https://github.com/openscriptures/morphhb/blob/master/LICENSE.md
    attribution: Open Scriptures Hebrew Bible Project
    tier: open
    method: vendored
    path: library/hebrew-bible/oshb

  - id: sblgnt
    name: SBL Greek New Testament
    upstream: https://github.com/LogosBible/SBLGNT
    commit: d7f35adca9ec410e1d1499c63b4dd989d76c8d4d
    license: CC-BY-4.0
    evidence: https://github.com/LogosBible/SBLGNT/blob/master/LICENSE
    attribution: Society of Biblical Literature and Logos Bible Software
    tier: open
    method: vendored
    path: library/greek-new-testament/sblgnt

  - id: morphgnt-sblgnt
    name: MorphGNT morphological tagging of the SBLGNT
    upstream: https://github.com/morphgnt/sblgnt
    commit: aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
    license: CC-BY-SA-3.0 (tagging); SBLGNT text CC-BY-4.0
    evidence: https://github.com/morphgnt/sblgnt/blob/master/README.md
    attribution: MorphGNT (James Tauber et al.)
    tier: open
    method: vendored
    path: library/greek-new-testament/morphgnt-sblgnt

  - id: byzantine-rp
    name: Robinson-Pierpont Byzantine Textform (2005/2018) with parsing and apparatus
    upstream: https://github.com/byztxt/byzantine-majority-text
    commit: 788ffe7c909e4d9c564ebed7083e93dd13d10b7c
    license: CC0-1.0 (public domain dedication)
    evidence: https://github.com/byztxt/byzantine-majority-text/blob/master/LICENSE
    tier: open
    method: vendored
    path: library/greek-new-testament/byzantine-robinson-pierpont

  - id: nestle1904
    name: Nestle 1904 Greek New Testament (text, morphology, XML, Berean glosses)
    upstream: https://github.com/biblicalhumanities/Nestle1904
    commit: 713f28a3b7d4d66132f5aa809fa223fe79762e5d
    license: Public domain text and glosses; morph CC0-1.0; xml markup CC-BY-SA-4.0
    evidence: https://github.com/biblicalhumanities/Nestle1904 (per-folder README files); https://berean.bible/terms.htm
    tier: open
    method: vendored
    path: library/greek-new-testament/nestle1904

  - id: cntr
    name: Center for New Testament Restoration manuscript transcriptions
    upstream: https://github.com/Center-for-New-Testament-Restoration/transcriptions
    commit: 4e743a41a4b2ca010ece53229cd272aa59b1efe6
    license: CC-BY-SA-4.0
    evidence: https://github.com/Center-for-New-Testament-Restoration/transcriptions/blob/main/LICENSE.md
    attribution: Alan Bunning and the Center for New Testament Restoration
    tier: open
    method: vendored
    path: library/greek-new-testament/cntr-transcriptions

  - id: stepbible
    name: STEPBible Data (tagged Hebrew/Greek Bibles, lexicons, proper names, versification)
    upstream: https://github.com/STEPBible/STEPBible-Data
    commit: 5de0a47f35f0fc13dfe1430d104e5db8a4285f9c
    license: CC-BY-4.0
    evidence: https://github.com/STEPBible/STEPBible-Data/blob/master/README.md

  # ---------------- Added in the second collection pass (2026-11-25) ----------------
  - id: swete-lxx
    name: Swete, The Old Testament in Greek according to the Septuagint (1909-1930)
    upstream: https://github.com/nathans/lxx-swete
    commit: 26bad3eb42bba98471d154c954e36a6f30a0279d
    license: CC-BY-SA-4.0 (derived from First1KGreek); Swete's text public domain
    evidence: https://github.com/nathans/lxx-swete/blob/master/README.md
    attribution: Open Greek and Latin Project (First1KGreek); nathans/lxx-swete contributors
    tier: open
    method: vendored
    path: library/septuagint/swete-lxx

  - id: tsk-crossreferences-org
    name: Treasury of Scripture Knowledge, phrase-level cross-references (KJV and BSB anchors)
    upstream: https://github.com/CrossReferences-org/bible-cross-references
    commit: ad41301f39f8118019080b53c212a3e9e064f5d7
    license: CC-BY-4.0
    evidence: https://github.com/CrossReferences-org/bible-cross-references/blob/main/LICENSE
    attribution: CrossReferences.org
    tier: open
    method: vendored
    path: library/cross-references/tsk-crossreferences-org
    notes: Only the KJV and BSB files are copied. The Segond 21 file (used by permission, not openly licensed) and the shared JSON export are NOT copied.

  - id: archive-org-pd
    name: Internet Archive public-domain books on Bible, commentary, theology, sermons, church fathers and biblical languages (about 20,000 items, OCR text)
    upstream: https://archive.org/advancedsearch.php
    license: Public domain in the USA (published before 1931; checked per item)
    evidence: each item's metadata (possible-copyright-status NOT_IN_COPYRIGHT, publication year) at https://archive.org/metadata/<identifier>
    tier: open
    method: fetch
    notes: Collects only the OCR plain text, never PDFs or images, and links each file to its scan. Skips Google-digitized items, lending-library items, items dated after 1930, and any item with restrictive rights metadata. Covers works such as Matthew Henry, Keil-Delitzsch, the Pulpit Commentary, Hastings, McClintock-Strong, Migne and CSEL volumes where scanned.

  - id: perseus-latin
    name: Perseus canonical Latin literature (background and early Christian Latin texts)
    upstream: https://github.com/PerseusDL/canonical-latinLit
    license: CC-BY-SA-4.0 unless otherwise indicated
    evidence: https://github.com/PerseusDL/canonical-latinLit/blob/master/license.md
    attribution: Perseus Digital Library, Tufts University
    tier: open
    method: mirror

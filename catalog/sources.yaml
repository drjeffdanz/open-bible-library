  - id: macula-hebrew
    name: MACULA Hebrew linguistic datasets (syntax trees, glosses, LXX equivalents)
    upstream: https://github.com/Clear-Bible/macula-hebrew
    license: CC-BY-4.0
    evidence: https://github.com/Clear-Bible/macula-hebrew/blob/main/LICENSE.md
    attribution: MACULA Hebrew Linguistic Datasets, Biblica Inc.
    tier: open
    method: mirror
    size: ~1.9 GB

  - id: macula-greek
    name: MACULA Greek linguistic datasets (syntax trees, word senses, Nestle1904 + SBLGNT)
    upstream: https://github.com/Clear-Bible/macula-greek
    license: CC-BY-4.0
    evidence: https://github.com/Clear-Bible/macula-greek/blob/main/LICENSE.md
    attribution: MACULA Greek Linguistic Datasets, Biblica Inc.
    tier: open
    method: mirror
    size: ~580 MB

  # ---------------- Translations ----------------
  - id: bsb
    name: Berean Standard Bible, Berean Literal Bible, Berean Reader's Bible, Majority Standard Bible
    upstream: https://berean.bible/downloads.htm
    license: Public domain (dedicated April 30, 2023)
    evidence: https://berean.bible/terms.htm
    tier: open
    method: fetch
    notes: Derivatives that change the text should not use the "Berean" name (publisher's request).

  - id: ebible-open
    name: eBible.org translations that are public domain, CC BY or CC BY-SA (440 translations)
    upstream: https://ebible.org/Scriptures/
    license: per translation, see catalog/ebible-licenses.csv
    evidence: https://ebible.org/Scriptures/copyright.php and each translation's /<id>/copyright.htm
    tier: open
    method: fetch
    notes: Includes KJV, ASV, WEB, YLT, Darby, Douay-Rheims, Geneva 1599, Tyndale, Webster, JPS 1917, Brenton LXX, Clementine Vulgate, Luther 1912, Reina-Valera 1909, Louis Segond 1910 and hundreds more. KJV remains under Crown copyright in the UK.

  - id: ebible-nd
    name: eBible.org translations licensed CC BY-ND 4.0 (87 translations)
    upstream: https://ebible.org/Scriptures/
    license: CC-BY-ND-4.0
    evidence: catalog/ebible-licenses.csv
    tier: open-nd
    method: fetch
    notes: Stored verbatim in their own folder. Never edit, merge or re-translate these files.

  - id: ebible-nc
    name: eBible.org translations licensed CC BY-NC-ND (748 translations)
    upstream: https://ebible.org/Scriptures/
    license: CC-BY-NC-ND-3.0 / CC-BY-NC-ND-4.0
    evidence: catalog/ebible-licenses.csv
    tier: noncommercial
    method: fetch

  # ---------------- Lexicons and reference ----------------
  - id: openscriptures-hebrew-lexicon
    name: Brown-Driver-Briggs and Strong's Hebrew lexicons (Open Scriptures)
    upstream: https://github.com/openscriptures/HebrewLexicon
    commit: 21c9add13bc727d3a951361778e97e3ff7afd1ce
    license: CC-BY-4.0 (markup); BDB and Strong's text public domain
    evidence: https://github.com/openscriptures/HebrewLexicon/blob/master/readme.md
    attribution: Open Scriptures Hebrew Bible Project
    tier: open
    method: vendored
    path: library/lexicons/openscriptures-hebrew-lexicon
    notes: Contains TWOT reference numbers only, not TWOT text (per upstream readme).

  - id: strongs
    name: Strong's Greek and Hebrew dictionaries (XML)
    upstream: https://github.com/openscriptures/strongs
    commit: 0acd2f251c2d35ff8db2dece4e0593979d3ac223
    license: Public domain
    evidence: rights elements inside the XML files ("Public Domain -- Copy Freely"; <rights>Public Domain</rights>)
    tier: open
    method: vendored
    path: library/lexicons/strongs
    notes: Hebrew XML carries TWOT index numbers only, not TWOT text.

  - id: abbott-smith
    name: Abbott-Smith, A Manual Greek Lexicon of the New Testament (1922), TEI
    upstream: https://github.com/translatable-exegetical-tools/Abbott-Smith
    commit: 8c00cb244761aa23659421a8cbbbf7a3b27b7d59
    license: Public domain
    evidence: https://github.com/translatable-exegetical-tools/Abbott-Smith/blob/master/README.md
    tier: open
    method: vendored
    path: library/lexicons/abbott-smith
    notes: The upstream archive.org PDF carries its own restrictions and is NOT copied.

  - id: perseus-lexica
    name: Perseus lexica (Liddell-Scott-Jones, Middle Liddell, Lewis & Short, and others)
    upstream: https://github.com/PerseusDL/lexica
    license: CC-BY-SA-4.0
    evidence: https://github.com/PerseusDL/lexica/blob/master/license.md
    attribution: Perseus Digital Library, Tufts University (http://www.perseus.tufts.edu/)
    tier: open
    method: mirror
    size: ~430 MB

  - id: openbible-cross-references
    name: OpenBible.info cross-references (~340,000, mostly from the Treasury of Scripture Knowledge)
    upstream: https://a.openbible.info/data/cross-references.zip
    license: CC-BY-4.0
    evidence: https://www.openbible.info/labs/cross-references/
    attribution: OpenBible.info
    tier: open
    method: fetch


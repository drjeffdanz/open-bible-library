  - id: first1kgreek
    name: First Thousand Years of Greek (patristic and classical Greek texts, TEI)
    upstream: https://github.com/OpenGreekAndLatin/First1KGreek
    license: CC-BY-SA-4.0
    evidence: https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/license.md
    attribution: Open Greek and Latin Project
    tier: open
    method: mirror

  - id: perseus-greek
    name: Perseus canonical Greek literature (includes Josephus, Philo and other background texts)
    upstream: https://github.com/PerseusDL/canonical-greekLit
    license: CC-BY-SA-4.0 unless otherwise indicated
    evidence: https://github.com/PerseusDL/canonical-greekLit/blob/master/README.md
    attribution: Perseus Digital Library, Tufts University
    tier: open
    method: mirror

  - id: gutenberg-christian
    name: Project Gutenberg books in Bible, theology and church history (LoC classes BR-BX)
    upstream: https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv
    license: Public domain in the USA (checked per book in its RDF record)
    evidence: https://www.gutenberg.org/policy/license.html
    tier: open
    method: fetch
    notes: Each book's RDF rights field must read "Public domain in the USA." or it is skipped. The Project Gutenberg header/footer is stripped so copies carry no PG trademark.

  - id: sefaria-open
    name: Sefaria texts (Tanakh, Mishnah, Talmud, midrash, commentary) licensed PD, CC0, CC BY or CC BY-SA
    upstream: https://github.com/Sefaria/Sefaria-Export
    license: per text version (license field in each JSON)
    evidence: https://github.com/Sefaria/Sefaria-Export/blob/master/LICENSE.md
    tier: open
    method: fetch
    notes: merged.json files are never used, because they mix licenses. Versions with license "unknown" are skipped.

  - id: sefaria-nc
    name: Sefaria texts licensed CC BY-NC
    upstream: https://github.com/Sefaria/Sefaria-Export
    license: CC-BY-NC
    evidence: license field in each JSON version
    tier: noncommercial
    method: fetch


      SELECTED: ${{ github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.source }}
    steps:
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
      - uses: actions/setup-python@v5
        if: env.SELECTED == 'true'
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
        if: env.SELECTED == 'true'
      - name: Fetch
        if: env.SELECTED == 'true'
        # -u: unbuffered, so progress shows in the log. --max-minutes leaves time to pack and upload
        # before the job timeout; anything not reached is listed as skipped in the manifest.
        run: python -u tools/fetch.py "${{ matrix.source }}" --shard "${{ matrix.shard }}" --out dist --max-minutes 300
      - name: Pack (split under GitHub's 2 GB asset limit)
        if: env.SELECTED == 'true'
        run: |
          mkdir -p pkg
          name="${{ matrix.source }}-shard$(echo '${{ matrix.shard }}' | sed 's#/#of#')"
          tar -C dist -czf - . | split -b 1900m -d -a 2 - "pkg/${name}.tar.gz.part"
          ls -la pkg
      - name: Upload to release
        if: env.SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          notes="Public-domain and openly licensed material. Follow each dataset's attribution terms (see MANIFEST*.json and SOURCE.json in each archive). CC BY-ND translations must stay unmodified."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "$notes" || true
          gh release upload "$tag" pkg/* --clobber

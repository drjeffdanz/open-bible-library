name: Build archive

# Downloads every mirrored and fetched source (see catalog/sources.yaml),
# packs each one, and publishes them as release assets:
#   archive-YYYY-MM   public-domain and openly licensed material (any use, including commercial;
#                     follow each license's attribution and share-alike terms)
# Run it from the Actions tab, or let it run on the 1st of each month.
# To redo one source after a failure, run it with "only" set to that source id.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build just this source id (e.g. gutenberg-christian). Leave empty for everything."
        required: false
        default: ""
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { source: macula-hebrew, shard: "0/1", tier: open }
          - { source: macula-greek, shard: "0/1", tier: open }
          - { source: perseus-lexica, shard: "0/1", tier: open }
          - { source: first1kgreek, shard: "0/1", tier: open }
          - { source: perseus-greek, shard: "0/1", tier: open }
          - { source: openbible-geocoding-full, shard: "0/1", tier: open }
          - { source: bsb, shard: "0/1", tier: open }
          - { source: openbible-cross-references, shard: "0/1", tier: open }
          - { source: ebible-open, shard: "0/2", tier: open }
          - { source: ebible-open, shard: "1/2", tier: open }
          - { source: ebible-nd, shard: "0/1", tier: open }
          - { source: gutenberg-christian, shard: "0/2", tier: open }
          - { source: gutenberg-christian, shard: "1/2", tier: open }
          - { source: sefaria-open, shard: "0/4", tier: open }
          - { source: sefaria-open, shard: "1/4", tier: open }
          - { source: sefaria-open, shard: "2/4", tier: open }
          - { source: sefaria-open, shard: "3/4", tier: open }
          - { source: archive-org-pd, shard: "0/32", tier: open }
          - { source: archive-org-pd, shard: "1/32", tier: open }
          - { source: archive-org-pd, shard: "2/32", tier: open }
          - { source: archive-org-pd, shard: "3/32", tier: open }
          - { source: archive-org-pd, shard: "4/32", tier: open }
          - { source: archive-org-pd, shard: "5/32", tier: open }
          - { source: archive-org-pd, shard: "6/32", tier: open }
          - { source: archive-org-pd, shard: "7/32", tier: open }
          - { source: archive-org-pd, shard: "8/32", tier: open }
          - { source: archive-org-pd, shard: "9/32", tier: open }
          - { source: archive-org-pd, shard: "10/32", tier: open }
          - { source: archive-org-pd, shard: "11/32", tier: open }
          - { source: archive-org-pd, shard: "12/32", tier: open }
          - { source: archive-org-pd, shard: "13/32", tier: open }
          - { source: archive-org-pd, shard: "14/32", tier: open }
          - { source: archive-org-pd, shard: "15/32", tier: open }
          - { source: archive-org-pd, shard: "16/32", tier: open }
          - { source: archive-org-pd, shard: "17/32", tier: open }
          - { source: archive-org-pd, shard: "18/32", tier: open }
          - { source: archive-org-pd, shard: "19/32", tier: open }
          - { source: archive-org-pd, shard: "20/32", tier: open }
          - { source: archive-org-pd, shard: "21/32", tier: open }
          - { source: archive-org-pd, shard: "22/32", tier: open }
          - { source: archive-org-pd, shard: "23/32", tier: open }
          - { source: archive-org-pd, shard: "24/32", tier: open }
          - { source: archive-org-pd, shard: "25/32", tier: open }
          - { source: archive-org-pd, shard: "26/32", tier: open }
          - { source: archive-org-pd, shard: "27/32", tier: open }
          - { source: archive-org-pd, shard: "28/32", tier: open }
          - { source: archive-org-pd, shard: "29/32", tier: open }
          - { source: archive-org-pd, shard: "30/32", tier: open }
          - { source: archive-org-pd, shard: "31/32", tier: open }
          - { source: perseus-latin, shard: "0/1", tier: open }
    # Skips every step when "only" names a different source (matrix values can't be used in a job-level if).
    env:
      SELECTED: ${{ github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.source }}
    steps:
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
      - uses: actions/setup-python@v5
        if: env.SELECTED == 'true'
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
        if: env.SELECTED == 'true'
      - name: Fetch
        if: env.SELECTED == 'true'
        # -u: unbuffered, so progress shows in the log. --max-minutes leaves time to pack and upload
        # before the job timeout; anything not reached is listed as skipped in the manifest.
        run: python -u tools/fetch.py "${{ matrix.source }}" --shard "${{ matrix.shard }}" --out dist --max-minutes 300
      - name: Pack (split under GitHub's 2 GB asset limit)
        if: env.SELECTED == 'true'
        run: |
          mkdir -p pkg
          name="${{ matrix.source }}-shard$(echo '${{ matrix.shard }}' | sed 's#/#of#')"
          tar -C dist -czf - . | split -b 1900m -d -a 2 - "pkg/${name}.tar.gz.part"
          ls -la pkg
      - name: Upload to release
        if: env.SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          tag="archive-${month}"
          notes="Public-domain and openly licensed material. Follow each dataset's attribution terms (see MANIFEST*.json and SOURCE.json in each archive). CC BY-ND translations must stay unmodified."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "$notes" || true
          gh release upload "$tag" pkg/* --clobber

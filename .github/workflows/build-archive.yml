name: Build archive

# Downloads every mirrored and fetched source (see catalog/sources.yaml),
# packs each one, and publishes them as release assets:
#   archive-YYYY-MM   public-domain and openly licensed material (any use, including commercial;
#                     follow each license's attribution and share-alike terms)
# Run it from the Actions tab, or let it run on the 1st of each month (skipped if that month's
# release was already built early).
# To redo one source after a failure, run it with "only" set to that source id.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build just this source id (e.g. gutenberg-christian). Leave empty for everything."
        required: false
        default: ""
      tag:
        description: "Release tag to upload to (e.g. archive-2026-11). Leave empty for archive-YYYY-MM of the day the run starts."
        required: false
        default: ""
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  # Fix the release tag once, when the run starts, so jobs that finish after the 1st of the next
  # month still upload to the same release.
  # A scheduled run is skipped when this month's release already exists, because someone built
  # the month early from the Actions tab (e.g. archive-2026-12 was built on 2026-11-28).
  # Manual runs always go ahead.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      skip: ${{ steps.t.outputs.skip }}
    steps:
      - id: t
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-archive-$(date -u +%Y-%m)}"
          case "$tag" in archive-[0-9][0-9][0-9][0-9]-[0-9][0-9]) ;; *) echo "bad tag: $tag"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "$EVENT" = "schedule" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists (built early), so this scheduled run is skipped."
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  fetch:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # 200 jobs; 10 at a time keeps the load on archive.org moderate (each job fetches 4 items at once).
      max-parallel: 10
      matrix:
        include:
          - { source: macula-hebrew, shard: "0/1", tier: open }
          - { source: macula-greek, shard: "0/1", tier: open }
          - { source: perseus-lexica, shard: "0/1", tier: open }
          - { source: first1kgreek, shard: "0/1", tier: open }
          - { source: perseus-greek, shard: "0/1", tier: open }
          - { source: openbible-geocoding-full, shard: "0/1", tier: open }
          - { source: bsb, shard: "0/1", tier: open }
          - { source: openbible-cross-references, shard: "0/1", tier: open }
          - { source: ebible-open, shard: "0/2", tier: open }
          - { source: ebible-open, shard: "1/2", tier: open }
          - { source: ebible-nd, shard: "0/1", tier: open }
          - { source: gutenberg-christian, shard: "0/2", tier: open }
          - { source: gutenberg-christian, shard: "1/2", tier: open }
          - { source: sefaria-open, shard: "0/4", tier: open }
          - { source: sefaria-open, shard: "1/4", tier: open }
          - { source: sefaria-open, shard: "2/4", tier: open }
          - { source: sefaria-open, shard: "3/4", tier: open }
          - { source: archive-org-pd, shard: "0/32", tier: open }
          - { source: archive-org-pd, shard: "1/32", tier: open }
          - { source: archive-org-pd, shard: "2/32", tier: open }
